[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  # @netlify/blobs v11 needs Node >= 22.12; pin it so the functions build
  # doesn't fall back to an older default.
  NODE_VERSION = "22"

# /demo is the resume-friendly spelling of /?demo - serve the SPA there
# instead of 404ing, without a catch-all that would shadow the functions.
[[redirects]]
  from = "/demo"
  to = "/index.html"
  status = 200
